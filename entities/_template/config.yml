# =============================================================================
# YouTube Thumbnail Configuration — TEMPLATE
# =============================================================================
# Duplicate this folder to entities/my-channel/ to configure your channel.
# =============================================================================

# --- ENTITY IDENTITY ---
entity:
  name: "My Channel Name"
  description: "Description of your YouTube channel content and target audience."
  language: "en"
  editorial_line: |
    Define the voice, tone, and positioning of your videos.

# --- FORMAT & DIMENSIONS ---
format:
  width: 1280
  height: 720
  ratio: "16:9"
  output_type: "jpg"

# --- GEMINI API ---
api:
  model: "gemini-3-pro-image-preview"
  action: "streamGenerateContent"
  endpoint_template: "https://generativelanguage.googleapis.com/v1beta/models/{model}:{action}?key={api_key}"
  method: "POST"
  env_variable: "NANOBANANA_API_KEY"
  image_config:
    aspect_ratio: "16:9"
    image_size: "1K"

# --- PHOTO CATALOG (relative to entities/my-channel/photos/) ---
photos:
  - file: "host-face.png"
    style: "cutout-color"
    description: "Front smiling headshot on transparent background."
    placement: "bottom-right corner"

# --- LAYOUTS ---
layouts:
  - name: "standard-right"
    description: "Title on top, thematic 3D illustration center, portrait bottom-right"
    affinities: ["tutorial", "review", "vlog"]
    prompt_composition: |
      Upper area: Large extra-bold title with strong visual contrast.
      Center-left: Clear thematic 3D/isometric illustration of the topic.
      Bottom-right: Clean dark background area reserved for local creator portrait overlay.

# --- BRAND GUIDELINES ---
brand:
  background: "Dark gradient with subtle texture"
  main_title_color: "White #FFFFFF and Accent Color"
  subtitle_color: "Bright Yellow or Orange"
  title_typography: "Extra-bold modern sans-serif"

# --- TITLING RULES ---
title_rules:
  max_title_length: 28
  max_subtitle_length: 45
  style: "High curiosity, benefit-driven"

# --- PROMPT TEMPLATE ---
prompt_template: |
  Create a modern professional YouTube thumbnail image, 1280x720 pixels, 16:9 ratio.
  
  BACKGROUND: {brand.background}.
  
  COMPOSITION LAYOUT:
  {layout_composition}
  
  TEXT STYLE:
  - Main title "{title}" in {brand.title_typography}. Colors: {brand.main_title_color}.
  - Subtitle "{subtitle}" in {brand.subtitle_color}.
  
  ILLUSTRATION:
  - {illustration_description}
  - Creative visual hook: {creative_element}
  
  STYLE: Clean, modern, high CTR contrast. No watermark, no logo, no distorted human faces.
  CRITICAL: Reserve bottom-right corner as a clean dark space for local portrait composite.
